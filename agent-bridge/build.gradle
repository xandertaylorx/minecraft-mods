plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "agent-bridge"
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"agent_bridge" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Automated in-game tests: ./gradlew runClientGameTest
	// Opens a real world and drives the MCP server over HTTP like Claude would.
	configureTests {
		createSourceSet = true
		modId = "agent_bridge_test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

repositories {
	maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Only for the showcase run (./gradlew runClientGameTest -Pshowcase), which takes the
	// website screenshots with Iris + the Blockshine shader pack. Normal test runs stay vanilla.
	gametestCompileOnly "maven.modrinth:iris:${project.iris_version}"
	gametestCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	if (project.hasProperty("showcase")) {
		gametestRuntimeOnly "maven.modrinth:iris:${project.iris_version}"
		gametestRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"
	}
}

afterEvaluate {
	tasks.matching { it.name == 'runClientGameTest' }.configureEach {
		if (project.hasProperty("showcase")) {
			jvmArgs "-Dagentbridge.showcase=${project.property('showcase')}"
			jvmArgs "-Dagentbridge.shaderPack=${file('../blockshine/pack').absolutePath}"
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
