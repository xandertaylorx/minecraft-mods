# Blockshine shader pack

# ---- Vanilla behaviour ----
oldLighting=false
sun=true
moon=true
clouds=fancy
shadowTranslucent=false
# Only you cast a shadow among moving things; mobs/chests skip the shadow pass (saves a lot of draw calls)
shadowEntities=false
shadowPlayer=true
shadowBlockEntities=false
underwaterOverlay=true
vignette=false

# ---- Skip whole passes when a feature is off (faster than an if inside the shader) ----
program.shadow.enabled=SHADOWS
program.composite.enabled=LIGHT_SHAFTS
program.composite1.enabled=BLOOM
program.world-1/shadow.enabled=false
program.world-1/composite.enabled=false
program.world1/shadow.enabled=false
program.world1/composite.enabled=false

# ---- Quality profiles ----
profile.POTATO=!SHADOWS shadowMapResolution=512 shadowDistance=48.0 SHADOW_FILTER=0 !WAVING_PLANTS !WAVING_LEAVES !WATER_WAVES WATER_REFLECTIONS !BLOOM !LIGHT_SHAFTS !VOLUMETRIC_LIGHT !LENS_FLARE !VIGNETTE
profile.LOW=SHADOWS shadowMapResolution=1024 shadowDistance=64.0 SHADOW_FILTER=0 WAVING_PLANTS !WAVING_LEAVES !WATER_WAVES WATER_REFLECTIONS BLOOM !LIGHT_SHAFTS !VOLUMETRIC_LIGHT LENS_FLARE VIGNETTE
profile.MEDIUM=SHADOWS shadowMapResolution=1024 shadowDistance=96.0 SHADOW_FILTER=1 WAVING_PLANTS WAVING_LEAVES WATER_WAVES WATER_REFLECTIONS BLOOM LIGHT_SHAFTS LIGHT_SHAFT_SAMPLES=6 !VOLUMETRIC_LIGHT LENS_FLARE VIGNETTE
profile.HIGH=SHADOWS shadowMapResolution=2048 shadowDistance=128.0 SHADOW_FILTER=2 WAVING_PLANTS WAVING_LEAVES WATER_WAVES WATER_REFLECTIONS BLOOM LIGHT_SHAFTS VOLUMETRIC_LIGHT VL_SAMPLES=8 LENS_FLARE VIGNETTE

# ---- Options menu ----
screen=<profile> <empty> [SHADOW_SCREEN] [LIGHT_SCREEN] [WORLD_SCREEN] [POST_SCREEN]
screen.SHADOW_SCREEN=SHADOWS SHADOW_FILTER shadowMapResolution shadowDistance SHADOW_STRENGTH sunPathRotation
screen.LIGHT_SCREEN=SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS MIN_LIGHT EMISSIVE_BLOCKS
screen.WORLD_SCREEN=WAVING_PLANTS WAVING_LEAVES WAVE_SPEED <empty> WATER_WAVES WATER_REFLECTIONS FOG_DENSITY
screen.POST_SCREEN=BLOOM BLOOM_STRENGTH LIGHT_SHAFTS VOLUMETRIC_LIGHT LIGHT_SHAFT_SAMPLES VL_SAMPLES LIGHT_SHAFT_STRENGTH VL_STRENGTH LENS_FLARE LENS_FLARE_STRENGTH <empty> EXPOSURE SATURATION VIGNETTE

sliders=VL_SAMPLES VL_STRENGTH LENS_FLARE_STRENGTH SHADOW_FILTER shadowMapResolution shadowDistance SHADOW_STRENGTH sunPathRotation SUN_BRIGHTNESS AMBIENT_BRIGHTNESS TORCH_BRIGHTNESS MIN_LIGHT WAVE_SPEED FOG_DENSITY BLOOM_STRENGTH LIGHT_SHAFT_SAMPLES LIGHT_SHAFT_STRENGTH EXPOSURE SATURATION
